services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: postgres
      DB_USERNAME: ${DB_USERNAME:-ticketing}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      RABBIT_HOST: rabbitmq
      RABBIT_USER: ${RABBIT_USER:-ticketing}
      RABBIT_PASSWORD: ${RABBIT_PASSWORD:-secret}
      JWT_SECRET: ${JWT_SECRET:-change-me-to-a-long-random-secret-of-32-bytes}
    depends_on:
      postgres:  { condition: service_healthy }
      redis:     { condition: service_started }
      rabbitmq:  { condition: service_healthy }

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ticketing
      POSTGRES_USER: ${DB_USERNAME:-ticketing}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-ticketing}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_USER:-ticketing}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD:-secret}
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

volumes:
  pgdata:
