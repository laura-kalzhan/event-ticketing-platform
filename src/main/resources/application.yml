spring:
  application:
    name: ticketing
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/ticketing
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        generate_statistics: true
        jdbc:
          time_zone: UTC
      jakarta:
        persistence:
          query:
            timeout: 5000
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2s
      connect-timeout: 2s
    web:
      pageable:
        default-page-size: 20
        max-page-size: 50
  cache:
    type: redis
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: 5672
    username: ${RABBIT_USER}
    password: ${RABBIT_PASSWORD}
    connection-timeout: 3s
    template:
      reply-timeout: 5s
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 4
          initial-interval: 1s
          multiplier: 2
          max-interval: 10s

ticketing:
  hold-ttl: 10m
  max-seats-per-booking: 8
  payment-window: 15m
  payment-timeout: 5s
  cancellation-cutoff: 24h
  outbox-interval: 2000
  cache:
    event: 15m
    event-list: 5m
    venue: 1h
    availability: 30s

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 15m
  refresh-token-expiration: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
